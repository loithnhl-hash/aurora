<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07070b">
    <title>404 · API SEVER Thành Lợi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #07070b;
            color: #ededee;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(700px 400px at 20% 20%, rgba(245,185,66,0.08), transparent 60%),
                radial-gradient(600px 400px at 80% 80%, rgba(248,113,113,0.05), transparent 60%);
            pointer-events: none;
        }
        .box {
            text-align: center;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 96px;
            font-weight: 700;
            background: linear-gradient(180deg, #ffd56b, #f5b942);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -0.04em;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }
        p {
            color: #7a7a85;
            font-size: 14px;
            margin-bottom: 28px;
        }
        a {
            display: inline-block;
            padding: 12px 22px;
            background: #f5b942;
            color: #07070b;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.18s;
        }
        a:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Trang không tồn tại</h1>
        <p>Đường dẫn bạn truy cập không đúng hoặc đã bị xoá.</p>
        <a href="./">← Về trang chính</a>
    </div>
</body>
</html>
